<body>
  <div class="glow a"></div><div class="glow b"></div>

    <section class="intro"><span class="tag">LICENSE ACTIVATION</span><h1>激活 NanbudoTV·AI</h1><p>悟空智能创作引擎，为短剧、电商、探店与广告宣传片提供一站式创作能力。</p><div class="safe"><i>✓</i><div><b>设备信息已匿名处理</b><span>软件只上传不可逆设备码，不上传您的文件、剧本或模型密钥。</span></div></div></section>
