<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小说转剧本</title>
  <link rel="stylesheet" href="/static/subtitle_removal242.css">
  <link rel="stylesheet" href="/static/novel_legacy249.css">
  <link rel="stylesheet" href="/static/themes228.css">
  <script src="/static/themes228.js"></script>
</head>
<body>
<main>
  <header>
    <span>NOVEL TO SCREENPLAY</span>
    <h1>小说转剧本 · 旧版任务</h1><a href="/static/novel_screenplay249.html">返回小说项目</a>
    <p>导入一段小说正文或一个章节，按要求改编为含人物行动和对白的分集剧本。</p>
  </header>
  <div class="workspace">
    <section class="panel">
      <h2>1 · 导入小说</h2>
      <form id="adaptForm">
        <label class="novel-field"><span>导入 TXT</span><input id="sourceFile" type="file" accept=".txt,text/plain"></label>
        <label class="novel-field"><span>小说正文</span><textarea id="sourceText" rows="13" required placeholder="可直接粘贴小说正文。长篇小说请按章节分次改编。"></textarea></label>
        <p id="sourceCount" class="muted"></p>
        <div class="novel-options">
          <label><span>剧本风格</span><select id="style"><option value="短剧">短剧</option><option value="漫剧">漫剧</option><option value="有声剧">有声剧</option><option value="影视剧">影视剧</option></select></label>
          <label><span>目标集数</span><select id="episodeCount"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
          <label><span>目标每集时长</span><select id="episodeSeconds"><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="90">90 秒</option><option value="120">120 秒</option></select></label>
        </div>
        <label class="novel-field"><span>改编要求（可选）</span><textarea id="requirements" rows="4" placeholder="例如：保留人名与主要事件，加强开场冲突，保留关键对白。"></textarea></label>
        <label class="novel-field"><span>前情（分批改编时可选）</span><textarea id="priorContext" rows="3" maxlength="2000" placeholder="可填写前几集的人物关系、已发生事件及上集结尾。"></textarea></label>
        <p id="quote" class="muted" role="status">正在读取模型和积分…</p>
        <div class="actions"><button id="start" class="primary" type="submit" disabled>生成剧本</button><button id="refreshQuote" type="button">刷新模型与积分</button><button id="resume" type="button" hidden>继续查询原任务</button></div>
        <p id="status" class="muted" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="panel">
      <h2>2 · 剧本初稿</h2>
      <label class="novel-field"><span>剧本内容（可编辑）</span><textarea id="screenplay" rows="19" placeholder="生成结果将在这里显示。"></textarea></label>
      <div class="actions"><button id="copyScreenplay" type="button" disabled>复制剧本</button><button id="downloadScreenplay" type="button" disabled>下载 TXT</button></div>
      <p id="resultStatus" class="muted" role="status"></p>
      <div id="continuityPanel" hidden>
        <label class="novel-field"><span>续写摘要（供下一批参考，可编辑）</span><textarea id="continuity" rows="5" maxlength="2000"></textarea></label>
        <button id="useContinuity" type="button">用作下一批前情</button>
      </div>
    </section>
  </div>
</main>
<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <form method="dialog">
    <h2 id="confirmTitle">确认生成剧本</h2>
    <p id="confirmText"></p>
    <div class="actions"><button value="cancel" autofocus>取消</button><button class="primary" value="yes">确认生成</button></div>
  </form>
</dialog>
<script src="/static/novel_legacy249.js"></script>
</body>
</html>
