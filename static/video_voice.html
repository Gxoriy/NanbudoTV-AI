<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频音色替换 · 分段配音</title><link rel="stylesheet" href="/static/video_voice.css"><link rel="stylesheet" href="/static/model_activity.css"><link rel="stylesheet" href="/static/aspect_ratio.css"><script src="/static/model_activity.js"></script><script src="/static/aspect_ratio.js"></script><link rel="stylesheet" href="/static/themes228.css"><script src="/static/themes228.js"></script></head>
<body><main><header><div><small>VIDEO VOICE WORKFLOW</small><h1>视频音色替换</h1><p>指定人物台词与时间段，选择系统音色或已授权克隆音色；生成后先验收，不自动覆盖原片。</p></div><a href="/static/breakdown.html">返回爆款拆解</a></header>
<link rel="stylesheet" href="/static/tutorials.css"><section class="tutorial-standalone" data-tutorial-section="video_voice" data-tutorial-embedded="allow"></section>
<section class="notice"><b>第一版边界</b><span>不自动分离说话人、不自动对嘴型。每个区间内原对白和背景音乐都会静音，区间外原音保留。60秒内最多12段。</span></section>
<section class="grid"><section class="panel"><h2>原视频</h2><video id="source" controls playsinline preload="metadata"></video><p id="sourceHint" class="muted">正在读取当前项目…</p><button id="refresh" type="button">刷新状态</button></section>
<section class="panel"><div class="row"><h2>台词与音色</h2><button id="add" type="button">添加一段</button><span id="statusLine" class="muted"></span></div><div id="segments"></div><div class="row end"><label class="rights"><input id="rights" type="checkbox">我确认拥有视频、人物及所选声音的使用授权</label><button id="quote" class="primary" type="button">报价</button></div><div id="quoteBox" class="quote hidden"></div><label id="continueBox" class="continue hidden"><input id="continueUnsubmitted" type="checkbox">继续未提交配音（已完成段不会重复扣费）</label><div class="row end"><button id="observe" type="button" class="hidden">查询原配音订单</button><button id="generate" class="primary" type="button" disabled>确认价格并生成</button></div><p id="message" role="status" class="status"></p></section></section>
<section id="resultPanel" class="panel hidden"><div class="row"><h2>新结果 · 待验收</h2><span>满意后再到项目中保存作品</span></div><video id="result" controls playsinline></video><a id="download" class="secondary" download>下载结果</a></section></main><script src="/static/tutorials.js"></script><script src="/static/video_voice.js"></script></body></html>
